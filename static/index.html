<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Voltage</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #888888);
    --accent: var(--tg-theme-button-color, #2a7de1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --low: #d9534f;
    --high: #e0912b;
    --ok: #2e9e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) {
      --bg: #17181a; --text: #f1f1f1; --hint: #9a9a9a; --card: #222427;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--text);
    /* Fill the screen: the chart card takes whatever height is left. */
    display: flex; flex-direction: column; min-height: var(--tg-viewport-stable-height, 100vh);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .status { font-size: 15px; color: var(--hint); }
  .volts { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .volts small { font-size: 24px; font-weight: 500; color: var(--hint); }
  .volts.low { color: var(--low); } .volts.high { color: var(--high); }
  .updated { font-size: 13px; color: var(--hint); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ranges { display: flex; gap: 8px; margin-bottom: 10px; }
  .ranges button {
    flex: 1; border: 0; border-radius: 10px; padding: 8px 0; font: inherit; font-size: 14px;
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  .ranges button.active { background: var(--accent); color: var(--accent-text); }
  .chart-card { flex: 1; display: flex; flex-direction: column; }
  .plot { flex: 1; position: relative; min-height: 240px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .share {
    width: 100%; border: 0; border-radius: 12px; padding: 14px 0; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .share:disabled { opacity: 0.6; cursor: default; }
  .stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--hint); margin-top: 8px; }
  .error { color: var(--low); }
</style>
</head>
<body>
  <div class="card">
    <div class="status" id="status">Connecting…</div>
    <div class="volts" id="volts">—</div>
    <div class="updated" id="updated"></div>
  </div>
  <div class="card chart-card">
    <div class="ranges">
      <button data-min="15">15 min</button>
      <button data-min="60" class="active">1 hour</button>
      <button data-min="180">3 hours</button>
    </div>
    <div class="plot"><canvas id="chart"></canvas></div>
    <div class="stats"><span id="min"></span><span id="max"></span></div>
  </div>
  <button class="share" id="share">📤 Share chart</button>

<script>
// Wrapped in a function: Telegram for macOS injects its own global `css`
// variable into the page, which overwrote ours.
(() => {
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.tg = "1"; }
const initData = tg ? tg.initData : "";

// Alert limits come from the server (VOLTAGE_LOW / VOLTAGE_HIGH).
let LOW = 180, HIGH = 250;
const NOMINAL = 230;

let rows = [];          // [timestamp, volts or null], oldest first
let lastTs = 0;
let rangeMin = 60;

document.querySelectorAll(".ranges button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".ranges button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  rangeMin = +b.dataset.min;
  draw();
});

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// Session from the server: keeps working after Telegram's login gets old,
// which happens when the page stays minimized on a phone for a day.
let session = "";
try { session = localStorage.getItem("session") || ""; } catch (e) {}
const authHeaders = () => ({ "X-Telegram-Init-Data": initData, "X-Session": session });

function showError(text) {
  document.getElementById("status").innerHTML = `<span class="error"></span>`;
  document.querySelector("#status .error").textContent = text;
}

async function poll() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(`api/data?since=${lastTs}`, { headers: authHeaders(), signal: ctrl.signal });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      showError(d.error || `Server error ${r.status}, retrying…`);
      return;
    }
    if (d.session) {
      session = d.session;
      try { localStorage.setItem("session", session); } catch (e) {}
    }
    LOW = d.low; HIGH = d.high;
    for (const row of d.history) rows.push(row);
    if (rows.length) lastTs = rows[rows.length - 1][0];
    const cutoff = Date.now() / 1000 - d.keep_minutes * 60;
    while (rows.length && rows[0][0] < cutoff) rows.shift();
    show(d.now);
    draw();
  } catch (e) {
    showError("📶 No connection to the server, retrying…");  // offline, timeout, or phone was asleep
  } finally {
    clearTimeout(timer);
  }
}

// One request at a time: on a slow mobile connection, overlapping requests
// used to pile up. Poll again right away when the page comes back into view.
let wake = null;
async function loop() {
  while (true) {
    await poll();
    await new Promise(res => { wake = res; setTimeout(res, 1000); });
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && wake) wake(); });

function show(now) {
  const status = document.getElementById("status");
  const volts = document.getElementById("volts");
  const stale = !now.ts || Date.now() / 1000 - now.ts > 15;
  volts.className = "volts";
  if (stale) {
    status.textContent = "⚠️ No data from the device";
    volts.innerHTML = "—";
  } else if (now.on === null) {
    status.textContent = "⏳ Checking whether there's electricity…";
    volts.innerHTML = "—";
  } else if (now.on) {
    status.textContent = "🔌 Electricity is on";
    volts.innerHTML = `${now.volts.toFixed(1)}<small> V</small>`;
    if (now.volts < LOW) volts.classList.add("low");
    if (now.volts > HIGH) volts.classList.add("high");
  } else {
    status.textContent = "⚫ No electricity";
    volts.innerHTML = "—";
  }
  document.getElementById("updated").textContent =
    now.ts ? "Updated " + new Date(now.ts * 1000).toLocaleTimeString() : "";
}

function draw() {
  const canvas = document.getElementById("chart");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const end = Date.now() / 1000, start = end - rangeMin * 60;
  const pts = rows.filter(r => r[0] >= start);
  const vals = pts.map(r => r[1]).filter(v => v !== null);
  const lo = Math.min(...vals, LOW) - 5, hi = Math.max(...vals, HIGH) + 5;
  const padL = 36, padB = 18;
  const x = t => padL + (t - start) / (end - start) * (w - padL - 4);
  const y = v => (h - padB) - (v - lo) / (hi - lo) * (h - padB - 6);
  const hm = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  ctx.font = "11px system-ui";
  // Round-number grid: every 5/10/20 V, about one line per 40 px.
  const guides = [LOW, NOMINAL, HIGH];
  const step = [5, 10, 20, 50].find(s => (h - padB) / ((hi - lo) / s) >= 36) || 50;
  ctx.strokeStyle = cssVar("--hint"); ctx.fillStyle = cssVar("--hint"); ctx.lineWidth = 1;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    ctx.globalAlpha = 0.12;
    ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(w, y(v)); ctx.stroke();
    ctx.globalAlpha = 0.8;
    if (guides.every(g => Math.abs(y(g) - y(v)) > 12)) ctx.fillText(`${v}`, 2, y(v) + 4);
  }
  // Horizontal guides: alert limits in light red, nominal voltage in grey.
  for (const [v, color] of [[LOW, cssVar("--low")], [NOMINAL, cssVar("--hint")], [HIGH, cssVar("--low")]]) {
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.globalAlpha = color === cssVar("--hint") ? 0.35 : 0.55; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(w, y(v)); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.fillText(`${v}`, 2, y(v) + 4);
  }
  // Time labels.
  ctx.fillStyle = cssVar("--hint");
  for (let i = 0; i <= 3; i++) {
    const t = start + (end - start) * i / 3;
    ctx.fillText(hm(t), Math.min(x(t) - 14, w - 34), h - 4);
  }
  // Outages: shaded, with the time the electricity went off and came back.
  const spans = [];
  for (let i = 0; i < pts.length; i++) {
    if (pts[i][1] !== null) continue;
    const from = pts[i][0];
    while (i < pts.length && pts[i][1] === null) i++;
    spans.push([from, i < pts.length ? pts[i][0] : null]);  // null end: still out
  }
  const labels = [];                   // drawn last, on top of the voltage line
  const mark = (t, label, side) => labels.push(() => {  // vertical text hanging from the top edge
    ctx.save(); ctx.translate(x(t), 3); ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "right"; ctx.textBaseline = side === "left" ? "bottom" : "top";
    ctx.fillText(label, 0, side === "left" ? -2 : 2);
    ctx.restore();
  });
  for (const [from, to] of spans) {
    const x0 = x(from), x1 = x(to ?? end);
    ctx.fillStyle = cssVar("--low"); ctx.globalAlpha = 0.12;
    ctx.fillRect(x0, 0, Math.max(1, x1 - x0), h - padB);
    const cutOff = from === pts[0][0];    // began before the visible window: start unknown
    if ((to ?? end) - from >= 60) {        // short blips get no labels
      if (to && x1 - x0 < 26 && !cutOff) mark(from, `off ${hm(from)}–${hm(to)}`, "left");
      else {
        if (!cutOff) mark(from, `off ${hm(from)}`, "left");
        if (to) mark(to, `on ${hm(to)}`, "right");
      }
    }
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = cssVar("--accent"); ctx.lineWidth = 2; ctx.beginPath();
  let pen = false;
  for (const [t, v] of pts) {
    if (v === null) { pen = false; continue; }
    pen ? ctx.lineTo(x(t), y(v)) : ctx.moveTo(x(t), y(v));
    pen = true;
  }
  ctx.stroke();
  ctx.fillStyle = cssVar("--low"); ctx.globalAlpha = 0.9; ctx.font = "10px system-ui";
  labels.forEach(draw => draw());
  ctx.globalAlpha = 1;

  document.getElementById("min").textContent = vals.length ? `min ${Math.min(...vals).toFixed(1)} V` : "";
  document.getElementById("max").textContent = vals.length ? `max ${Math.max(...vals).toFixed(1)} V` : "";
}

// Share: the server prepares a message (chart picture + summary) for the
// chosen range, then Telegram shows its own chat picker.
const shareBtn = document.getElementById("share");
const shareLabel = () => {
  shareBtn.textContent = `📤 Share last ${rangeMin < 60 ? rangeMin + " min" : rangeMin / 60 + (rangeMin === 60 ? " hour" : " hours")}`;
};
shareLabel();
document.querySelectorAll(".ranges button").forEach(b => b.addEventListener("click", shareLabel));
const notify = msg => (tg && tg.showAlert ? tg.showAlert(msg) : alert(msg));
shareBtn.onclick = async () => {
  if (!tg || !tg.shareMessage || !tg.isVersionAtLeast("8.0")) {
    notify("Sharing needs a newer Telegram app. Please update Telegram.");
    return;
  }
  shareBtn.disabled = true; shareBtn.textContent = "Preparing…";
  try {
    const r = await fetch("api/share", {
      method: "POST",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ minutes: rangeMin }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    tg.shareMessage(d.id);
  } catch (e) {
    notify("Couldn't share: " + e.message);
  } finally {
    shareBtn.disabled = false; shareLabel();
  }
};

window.addEventListener("resize", draw);
if (tg) tg.onEvent("viewportChanged", draw);
loop();
})();
</script>
</body>
</html>
